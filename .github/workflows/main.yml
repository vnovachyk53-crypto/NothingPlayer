name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Працює і з розпакованим проєктом, і з ZIP-архівом у корені репозиторію
      - name: Find project
        id: project
        run: |
          if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*')" ]; then
            for archive in *.zip; do unzip -q -o "$archive"; done
          fi
          settings="$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)"
          if [ -z "$settings" ]; then
            echo "settings.gradle.kts not found: upload the project ZIP to the repository root"
            exit 1
          fi
          echo "dir=$(dirname "$settings")" >> "$GITHUB_OUTPUT"

      - name: Install Android SDK 36
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          bash gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NothingAudio-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
